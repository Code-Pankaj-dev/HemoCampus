<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HemoCampus - Donor Registration</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins','Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#ff416c,#ff4b2b);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.container{
    width:100%;
    max-width:950px;
    background:#fff;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(255,0,0,.25);
    padding:40px;
    border-top:6px solid #e74c3c;
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.header .icon{
    font-size:55px;
}

.header h2{
    color:#c0392b;
    margin-top:10px;
}

.header p{
    color:#777;
}

.section-title{
    margin:25px 0 15px;
    color:#c0392b;
    border-left:5px solid #e74c3c;
    padding-left:10px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.input-group{
    display:flex;
    flex-direction:column;
}

.input-group label{
    margin-bottom:8px;
    font-weight:500;
    color:#444;
}

.input-group input,
.input-group select,
.input-group textarea{

    padding:13px;
    border:2px solid #ddd;
    border-radius:10px;
    outline:none;
    transition:.3s;
    font-size:15px;
}

.input-group input:focus,
.input-group select:focus,
.input-group textarea:focus{

    border-color:#e74c3c;
}

textarea{
    resize:none;
}

.full{
    grid-column:1/-1;
}

.btn{
    margin-top:30px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#e74c3c,#c0392b);
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

.login-link{
    text-align:center;
    margin-top:20px;
}

.login-link a{
    color:#c0392b;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:768px){

.form-grid{
grid-template-columns:1fr;
}

.container{
padding:25px;
}

}
</style>

</head>
<body>

<div class="container">

<div class="header">
<div class="icon">🩸</div>
<h2>HemoCampus</h2>
<p>Become a Voluntary Blood Donor</p>
</div>

<form action="{% url 'DonorRegisterData' %}" method="POST">
    {% csrf_token %}

<h3 class="section-title">Personal Information</h3>

<div class="form-grid">

<div class="input-group">
<label>Full Name</label>
<input type="text" name="full_name" required>
</div>

<div class="input-group">
<label>Gender</label>
<select name="gender" required>
<option>Select</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<div class="input-group">
<label>Date of Birth</label>
<input type="date" id="dob" name="dob" required>
</div>

<div class="input-group">
<label>Age</label>
<input type="number" id="age" name="age" readonly>
</div>

<div class="input-group">
<label>Blood Group</label>
<select name="blood_group" required>
<option>Select</option>
<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>
</select>
</div>

<div class="input-group">
<label>Weight (KG)</label>
<input type="number" name="weight" min="50" required>
</div>

</div>

<h3 class="section-title">Contact Information</h3>

<div class="form-grid">

<div class="input-group">
<label>Mobile Number</label>
<input type="tel" name="mobile" maxlength="10" required>
</div>

<div class="input-group">
<label>Email</label>
<input type="email" name="email" required>
</div>

<div class="input-group">
<label>State</label>
<input type="text" name="state">
</div>

<div class="input-group">
<label>City</label>
<input type="text" name="city">
</div>

<div class="input-group">
<label>Pincode</label>
<input type="text" name="pincode">
</div>

<div class="input-group full">
<label>Complete Address</label>
<textarea name="address"></textarea>
</div>

</div>

<h3 class="section-title">Medical Information</h3>

<div class="form-grid">

<div class="input-group">
<label>Last Blood Donation</label>
<input type="date" name="last_donation">
</div>

<div class="input-group">
<label>Hemoglobin</label>
<input type="number" step="0.1" name="hemoglobin">
</div>

<div class="input-group">
<label>Any Disease?</label>
<select name="disease">
<option>No</option>
<option>Yes</option>
</select>
</div>

<div class="input-group">
<label>Disease Details</label>
<input type="text" name="disease_details">
</div>

<div class="input-group">
<label>Taking Medicine?</label>
<select name="medicine">
<option>No</option>
<option>Yes</option>
</select>
</div>

<div class="input-group">
<label>Previous Donation?</label>
<select name="previous_donation">
<option>No</option>
<option>Yes</option>
</select>
</div>

</div>

<h3 class="section-title">Account Information</h3>

<div class="form-grid">

<div class="input-group">
<label>Username</label>
<input type="text" name="username" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" name="password" required>
</div>

<div class="input-group full">
<label>Confirm Password</label>
<input type="password" name="confirm_password" required>
</div>

</div>

<div style="margin-top:20px">

<label>
<input type="checkbox" required>
I confirm that all information provided is correct.
</label>

</div>

<button class="btn">
🩸 Register Now
</button>

<div class="login-link">
Already Registered?
<a href="/login/">Login Here</a>
</div>

</form>

</div>

<script>

const dob=document.getElementById("dob");
const age=document.getElementById("age");

dob.addEventListener("change",()=>{

let birth=new Date(dob.value);

let today=new Date();

let a=today.getFullYear()-birth.getFullYear();

let m=today.getMonth()-birth.getMonth();

if(m<0 || (m===0 && today.getDate()<birth.getDate()))
a--;

age.value=a;

});

</script>

</body>
</html>
