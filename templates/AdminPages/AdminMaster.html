<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HemoCampus - Admin</title>
  <style>
    :root {
      --primary: #dc2626;
      --primary-light: #fee2e2;
      --dark: #1e293b;
      --dark-light: #334155;
      --light: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;
      --text: #475569;
      --text-light: #64748b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--light);
      color: var(--dark);
    }
    .dashboard { display: flex; min-height: 100vh; }

    /* Sidebar CSS yahan rakho - ek hi baar */
    .sidebar {
      width: 240px;
      background: var(--dark);
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      z-index: 100;
    }
    .logo { padding: 24px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255, 255, 0.08); }
    .logo-icon { width: 38px; height: 38px; background: var(--primary); border-radius: 10px; display: grid; place-items: center; }
    .logo-icon svg { width: 22px; height: 22px; fill: white; }
    .logo-text h1 { font-size: 18px; color: white; font-weight: 700; }
    .logo-text p { font-size: 12px; color: #94a3b8; }
    .sidebar nav { padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; }
    .sidebar nav a { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 8px; color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s ease; }
    .sidebar nav a svg { width: 20px; height: 20px; stroke-width: 2; flex-shrink: 0; }
    .sidebar nav a:hover { background: rgba(255, 255, 0.06); color: white; }
    .sidebar nav a.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25); }
    .sidebar nav a.logout { margin-top: auto; border-top: 1px solid rgba(255, 255, 255, 0.08); margin-top: 16px; padding-top: 16px; }

    /* Main content wrapper */
    .main {
      flex: 1;
      margin-left: 240px;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0L12 2.69z" />
          </svg>
        </div>
        <div class="logo-text">
          <h1>HemoCampus</h1>
          <p>Admin Panel</p>
        </div>
      </div>
      <nav>
        <a href="/" class="{% if request.path == '/' %}active{% endif %}">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
          <span>Dashboard</span>
        </a>
        <a href="/Manage_Donors/" class="{% if '/Manage_Donors' in request.path %}active{% endif %}">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
          <span>Manage Donors</span>
        </a>
        <a href="/Manage_Request/" class="{% if '/Manage_Request' in request.path %}active{% endif %}">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg>
          <span>Manage Requests</span>
        </a>
        <a href="/Blood_Stock/" class="{% if '/Blood_Stock' in request.path %}active{% endif %}">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>
          <span>Blood Stock</span>
        </a>
        <a href="/Report_Analytics/" class="{% if '/Report_Analytics' in request.path %}active{% endif %}">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
          <span>Reports</span>
        </a>
        <a href="/Setting/" class="{% if '/Setting' in request.path %}active{% endif %}">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
          <span>Settings</span>
        </a>
        <a href="#" class="logout">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
          <span>Logout</span>
        </a>
      </nav>
    </aside>

    <main class="main">
      {% block content %}
      {% endblock %}
    </main>
  </div>
</body>
</html>
