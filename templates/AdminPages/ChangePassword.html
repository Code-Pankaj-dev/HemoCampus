{% extends 'AdminPages/AdminMaster.html' %}

{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}

<style>

.settings-wrapper{
    max-width:550px;
    margin:40px auto;
}

.settings-card{
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.form-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

.button-group{
    display:flex;
    gap:10px;
}

.btn{
    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#f59e0b;
    color:white;
    cursor:pointer;
    text-decoration:none;
    text-align:center;
    font-weight:bold;
}

.btn:hover{
    background:#d97706;
}

.btn-secondary{
    background:#6c757d;
}

.alert-success{
    background:#d4edda;
    color:#155724;
    padding:10px;
    margin-bottom:20px;
    border-radius:5px;
}

.alert-danger{
    background:#f8d7da;
    color:#721c24;
    padding:10px;
    margin-bottom:20px;
    border-radius:5px;
}

</style>


<div class="settings-wrapper">

<div class="settings-card">

<h2>🔒 Change Password</h2>
<p>Change your account password securely.</p>

{% if msg %}
<div class="alert-{{ color }}">
    {{ msg }}
</div>
{% endif %}

<form method="POST">

    {% csrf_token %}
    <div class="form-group">
        <label>New Password</label>
        <input type="password" name="new_password" required>
    </div>

    <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required>
    </div>

    <div class="button-group">

        <button type="submit" class="btn">
            Update Password
        </button>

        <a href="/dashboard/" class="btn btn-secondary">
            Cancel
        </a>

    </div>

</form>

</div>

</div>

{% endblock %}
